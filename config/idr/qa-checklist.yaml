# Federal IDR determination QA checklist.
# Reviewer edits land in this file. The loader validates the schema.
# Hard-stop gates cannot be removed or set to blocking: false.
# Template bodies stay marked TODO-LIVE-TEXT until live prose is supplied.
# This file does not invent that prose.

version: "2026-10-21.1"
schema: idr-qa-checklist

factors:
  - id: qpa
    number: 1
    label: "Qualifying payment amount"
  - id: training_experience
    number: 2
    label: "Training, experience, and quality and outcomes measurements"
  - id: market_share
    number: 3
    label: "Market share in the geographic region"
  - id: acuity_complexity
    number: 4
    label: "Acuity of the individual or complexity of furnishing the item or service"
  - id: teaching_case_mix
    number: 5
    label: "Teaching status, case mix, and scope of services"
  - id: good_faith_efforts
    number: 6
    label: "Good faith efforts to enter network agreements and prior contracted rates"
  - id: additional_information
    number: 7
    label: "Additional information relating to the offer"
    never_credit_party: IP

gates:
  - id: template_match
    blocking: true
    label: "Selected template matches the prevailing party, brief state, dispute shape, and NIP branch."
  - id: no_cpt_in_acuity
    blocking: true
    label: "Acuity and complexity text contains no CPT code and no clinical argument. The no-acuity paragraph slot is filled when no records or operative report were filed."
    factor: acuity_complexity
    forbid_pattern: "\\b\\d{5}\\b"
    forbid_tokens:
      - "CPT"
      - "HCPCS"
    argument_forbid:
      - "warrants"
      - "justifies"
      - "because the patient"
      - "higher acuity"
      - "more complex than"
  - id: cv_from_file
    blocking: true
    label: "The CV sentence slot carries board certification and specialty from the curriculum vitae file."
    factor: training_experience
    source_role: cv
  - id: qpa_variant
    blocking: true
    label: "Batched lines link to the primary line. A single dispute has no batch link."
  - id: factor_7_rule
    blocking: true
    label: "Factor 7 is never credited to the initiating party. Chart support may credit the non-initiating party."
    factor: additional_information
    never_credit_party: IP
    credit_patterns:
      - "supports the initiating party"
      - "weighs in favor of the initiating party"
      - "favors the initiating party"
      - "credited to the initiating party"
      - "initiating party prevails on this factor"
  - id: neutral_tone
    blocking: true
    label: "The determination stays in a neutral tone."
    forbid_phrases:
      - "clearly"
      - "obviously"
      - "meritless"
      - "unreasonable"
      - "excessive"
      - "outrageous"
      - "frivolous"
      - "fails to"
      - "bad faith"
  - id: numbers_match_source
    blocking: true
    label: "Offers and qualifying payment amounts match the sourced figures, are never estimated, and are not identical across the parties."

slots:
  live_text_marker: "TODO-LIVE-TEXT"
  batch_line_link: "same as"
  no_acuity_paragraph: "TODO-LIVE-TEXT"
  paragraph_roles:
    - chart
    - ip
    - nip
    - winner

phrases:
  training_from_cv: "cv board_certification:{{board_certification}} specialty:{{specialty}}"
  training_absent: "training:absent {{party}}"
  acuity_both: "acuity_attachments:records,op_report"
  acuity_records: "acuity_attachments:records"
  acuity_report: "acuity_attachments:op_report"
  acuity_absent: "acuity:absent"
  party_submitted: "factor:{{factor}} party:{{party}} submitted:yes"
  party_absent: "factor:{{factor}} party:{{party}} submitted:no"
  factor_7: "factor_7 party:{{party}} state:{{state}} credit:{{credit}}"
  qpa_factor: "qpa:sourced"

ops_markup:
  - "MISSING"
  - "{{"
  - "}}"
  - "TODO-LIVE-TEXT"
  - "FIXME"
  - "HEURISTIC_MODE"
  - "TEMPLATE_DEVIATION"
  - "LOW_CONFIDENCE"
  - "EXTRACTION_GAP"
